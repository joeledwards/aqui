[package]
name = "aqui"
version = "8.1.1"
authors = ["Joel Edwards <joeledwards@gmail.com>"]
edition = "2024"
rust-version = "1.87"
description = "Human-friendly CLI HTTP client"
license = "MIT"
repository = "https://github.com/joeledwards/aqui"
readme = "README.md"
keywords = ["http", "cli", "client", "https", "rest"]
categories = ["command-line-utilities", "web-programming::http-client"]
include = ["src/**", "docs/**", "tools/check_transport.py", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "rust-toolchain.toml"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
